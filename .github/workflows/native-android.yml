name: Build M-Fit Native Android
on:
  workflow_dispatch:
  push:
    branches:
      - "native-migration/**"
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"

permissions:
  contents: read

concurrency:
  group: mfit-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MFIT_RELEASE_STORE_PASSWORD: ${{ secrets.MFIT_RELEASE_STORE_PASSWORD }}
      MFIT_RELEASE_KEY_ALIAS: ${{ secrets.MFIT_RELEASE_KEY_ALIAS }}
      MFIT_RELEASE_KEY_PASSWORD: ${{ secrets.MFIT_RELEASE_KEY_PASSWORD }}
      MFIT_RELEASE_KEYSTORE_BASE64: ${{ secrets.MFIT_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
      - name: Run unit tests and build debug APK
        working-directory: native-android
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Upload native debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MFit-Native-Debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare persistent release keystore
        if: ${{ env.MFIT_RELEASE_KEYSTORE_BASE64 != '' && env.MFIT_RELEASE_STORE_PASSWORD != '' && env.MFIT_RELEASE_KEY_ALIAS != '' && env.MFIT_RELEASE_KEY_PASSWORD != '' }}
        run: |
          echo "$MFIT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mfit-release.jks"
          echo "MFIT_RELEASE_STORE_FILE=$RUNNER_TEMP/mfit-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.MFIT_RELEASE_KEYSTORE_BASE64 != '' && env.MFIT_RELEASE_STORE_PASSWORD != '' && env.MFIT_RELEASE_KEY_ALIAS != '' && env.MFIT_RELEASE_KEY_PASSWORD != '' }}
        working-directory: native-android
        env:
          MFIT_RELEASE_STORE_FILE: ${{ runner.temp }}/mfit-release.jks
        run: gradle assembleRelease --stacktrace

      - name: Upload signed release APK
        if: ${{ env.MFIT_RELEASE_KEYSTORE_BASE64 != '' && env.MFIT_RELEASE_STORE_PASSWORD != '' && env.MFIT_RELEASE_KEY_ALIAS != '' && env.MFIT_RELEASE_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: MFit-Native-Release
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
