name: Build M-Fit Native Android
on:
  workflow_dispatch:
  push:
    branches:
      - "native-migration/**"
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
      - name: Run unit tests and build debug APK
        working-directory: native-android
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Upload native debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MFit-Native-Debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
