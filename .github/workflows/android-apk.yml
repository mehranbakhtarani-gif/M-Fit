name: Build Mfit Android APK
# Build the Android wrapper from the web app and sync installed Capacitor plugins.
# Rebuilds are triggered by activity UI and route-sharing changes.
# Includes the final glass-control polish.

on:
  workflow_dispatch:
  push:
    branches: [main, mfit-complete-fixes]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'native-bridge.js'
      - 'icon.svg'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          matches = re.findall(r"(<script(?:\s[^>]*)?>)(.*?)</script\s*>", html, flags=re.I | re.S)
          scripts = [(tag, body) for tag, body in matches if "type=\"importmap\"" not in tag.lower()]
          if not scripts:
              raise SystemExit("No inline scripts found")
          for index, (tag, script) in enumerate(scripts):
              suffix = ".mjs" if "type=\"module\"" in tag.lower() else ".js"
              path = Path(f"/tmp/mfit-inline-{index}{suffix}")
              path.write_text(script, encoding="utf-8")
              print(f"Checking inline script {index + 1}/{len(scripts)}")
              import subprocess
              subprocess.run(["node", "--check", str(path)], check=True)
          PY
      - name: Download offline Persian voice engine
        run: |
          mkdir -p assets/tts
          base="https://raw.githubusercontent.com/gyroing/Persian-Piper-TTS-WebAssembly/master"
          for file in sherpa-onnx.js sherpa-onnx-wasm-main.js sherpa-onnx-wasm-main.wasm sherpa-onnx-wasm-main.data LICENSE; do
            curl --fail --location --retry 3 --retry-delay 2 "$base/$file" -o "assets/tts/$file"
          done
      - name: Prepare web app
        run: npm run prepare:web
      - name: Verify exact PWA UI and native haptics are included in Android bundle
        run: |
          test -s www/index.html
          cmp -s index.html www/index.html
          for file in icon.svg icon-192.svg icon-512.svg manifest.webmanifest sw.js; do
            if [ -f "$file" ]; then cmp -s "$file" "www/$file"; fi
          done
          if [ -d assets ]; then diff -qr assets www/assets; fi
          grep -q 'fast-time-wheel' www/index.html
          grep -q 'fastHoursTrigger' www/index.html
          grep -q 'fast-settings-row' www/index.html
          grep -q 'timePickerTick' www/index.html
          grep -q 'timePickerSelectHaptic' www/index.html
          grep -q 'MfitNativeHaptics' www/index.html
          grep -q "registerPlugin('MfitHaptics')" native-bridge.js
          grep -q 'MfitHapticsPlugin' scripts/prepare-android.mjs
          echo "Verified exact PWA HTML/assets parity and native Android wheel haptics."
      - name: Generate Android project
        run: npx cap add android
      - name: Generate Mfit launcher resources and native Live Update integration
        run: npm run prepare:android
      - name: Set Android SDK levels for Live Updates
        run: |
          test -f android/variables.gradle
          sed -i -E 's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/compileSdkVersion = 36/' android/variables.gradle
          sed -i -E 's/targetSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/targetSdkVersion = 36/' android/variables.gradle
          grep -nE 'compileSdkVersion|targetSdkVersion' android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android
      - name: Configure persistent M-FIT debug signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MFIT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing MFIT_DEBUG_KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Mfit APK
        uses: actions/upload-artifact@v4
        with:
          name: Mfit
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
