name: Build Mfit Android APK
# Uses the runner-provisioned Android SDK; no setup action that installs obsolete SDK tools.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icon.svg'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'platform-tools,platforms;android-35,build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run prepare:web
      - name: Generate Android project
        run: npx cap add android
      - name: Apply Mfit launcher icon
        run: npm run prepare:android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload Mfit APK
        uses: actions/upload-artifact@v4
        with:
          name: Mfit
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
