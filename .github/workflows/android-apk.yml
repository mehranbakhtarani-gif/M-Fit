name: Build Mfit Android APK
# Build the Android wrapper from the web app and sync installed Capacitor plugins.

on:
  workflow_dispatch:
  push:
    branches: [main, mfit-complete-fixes]
    paths:
      - 'index.html'
      - 'native-bridge.js'
      - 'icon.svg'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script\\s*>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline scripts found")
          for index, script in enumerate(scripts):
              path = Path(f"/tmp/mfit-inline-{index}.js")
              path.write_text(script, encoding="utf-8")
              print(f"Checking inline script {index + 1}/{len(scripts)}")
              import subprocess
              subprocess.run(["node", "--check", str(path)], check=True)
          PY
      - name: Prepare web app
        run: npm run prepare:web
      - name: Generate Android project
        run: npx cap add android
      - name: Apply Mfit launcher icon
        run: npm run prepare:android
      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload Mfit APK
        uses: actions/upload-artifact@v4
        with:
          name: Mfit
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
